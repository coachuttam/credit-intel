# Settings for the AI Credit Intelligence Platform (PRD D-02, NFR-09).
# Each setting can be overridden by an environment variable.

[llm]
provider = "openai"          # CREDIT_INTEL_LLM_PROVIDER ("openai" or "fake")
model_id = "gpt-4o-mini"     # CREDIT_INTEL_LLM_MODEL_ID; the PRD's proposed baseline (D-02)

max_output_tokens = 4096     # CREDIT_INTEL_MAX_OUTPUT_TOKENS; per-call output limit, reserved against the ceiling

# token_ceiling is REQUIRED and deliberately has no default (OD-8, NFR-09).
# Set it here, or with CREDIT_INTEL_TOKEN_CEILING. A missing, non-integer, zero
# or negative value fails with E-CONFIG-INVALID.
# token_ceiling = <a positive integer>

# Which provider does each step (PRD v0.4.31). `extract` must be the [llm] provider; `classify` runs only when
# the environment variable USE_JEV is "true" (default: off, and then behaviour is exactly as without this table).
[steps]
classify = "jev"
extract = "openai"

# Optional page classification by Jev (TypeSafe AI). Provisional, tuned on the tuning set only (O.2). The API key is
# read from TYPESAFE_API_KEY in the environment only. The price of a Jev call has no default (D-02): enter it after
# checking docs.typesafe.ai, here or with CREDIT_INTEL_JEV_PRICE_INPUT_PER_MILLION.
[jev]
model = "jev-latest"            # an alias that moves with new releases; every response's versioned ID is logged
threshold = 0.85                # confidence (0 to 1) a label needs before a page may be dropped
timeout_seconds = 10.0          # per call
time_budget_seconds = 60.0      # per document; then Jev is skipped for its remaining pages
state_lines = 40                # lines from the top of a page that Jev reads
max_consecutive_failures = 3    # then Jev is skipped for the rest of the run

# OCR of scanned pages (PRD v0.4.44, FR-001A). OCR is OFF unless `enabled = true` here or `--ocr` is given, and it runs only with
# `--pages`. Once on, the five settings below are REQUIRED and have no default; a missing one fails with E-CONFIG-INVALID.
# Values set by the owner on 2026-10-27; the three measured ones come from the two tuning scans (S1, S2). They are provisional and not measured on a held-out scan.
[ocr]
min_image_area_share = 0.5   # an image must cover at least this share of a page for it to count as image-only (tuning pages: 0.85 to 1.0)
column_margin_pt = 3         # period-column margin; the tuning pages did not distinguish 1 to 12 pt, so the text-layer value is kept
split_figure_gap_pt = 0      # 0 turns the joining of split figures off: no split figure was seen in the OCR output of the tuning pages
max_pages = 10               # the page cap (OD-18): more image-only pages than this in a run is E-INPUT-OCR-FAILED
timeout_seconds = 120        # the time limit for one OCR call (OD-18), whole call; measured 1 to 3.5 s per page on the tuning pages

# Parse limits (PRD v0.4.50, SEC-12). The PDF libraries run in a worker process that is stopped when it passes either limit
# (E-INPUT-PARSE-LIMIT). BOTH ARE REQUIRED and deliberately have no default: set them here, or with
# CREDIT_INTEL_PARSE_TIMEOUT_SECONDS and CREDIT_INTEL_PARSE_MEMORY_MB. A missing, non-numeric, zero or negative value fails with
# E-CONFIG-INVALID. The time is one budget for all parsing in a run; the memory is the worker's resident memory, watched by the parent.
# Values set by the owner on 2026-10-27, from the synthetic timings in PROGRESS (a dense 600-page file took about 100 to 110 s and
# about 2.4 GB for one operation); not yet checked against public reports.
[ingestion]
parse_timeout_seconds = 300   # one budget for all parsing in a run
parse_memory_mb = 4096        # the worker's resident memory, polled by the parent
