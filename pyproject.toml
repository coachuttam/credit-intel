[project]
name = "ai-credit-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "markdown-it-py>=4.2.0",
    "openai>=3.35.1",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "typesafe-sdk==0.7.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
credit-intel = "credit_intel.cli:run"
credit-intel-api = "credit_intel.api.__main__:run"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "credit_intel"

[tool.pytest.ini_options]
markers = [
    "live: calls the real OpenAI API; skipped unless CREDIT_INTEL_LIVE=1 and OPENAI_API_KEY are set",
    "real_ocr: runs the real Tesseract engine; skipped unless it is installed and CREDIT_INTEL_REAL_OCR=1 is set",
]
